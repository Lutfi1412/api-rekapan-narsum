# ============================================================
#  docker-compose.yaml — API + PostgreSQL
#  Jalankan: docker compose up -d --build
#  API  : http://localhost:3000  (docs: /docs)
#  DB   : localhost:5433 -> postgres/postgres -> rekapan_narsum_tsi
# ============================================================

services:
  db:
    image: postgres:18-alpine
    container_name: narsum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: rekapan_narsum_tsi
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 menyimpan data di /var/lib/postgresql (bukan .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rekapan_narsum_tsi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: narsum-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      db_url: postgres://postgres:root@db:5432/rekapan_narsum_tsi
      DATABASE_URL: postgres://postgres:root@db:5432/rekapan_narsum_tsi
      JWT_SECRET: ${JWT_SECRET:-lutfi ganteng}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      PORT: 3000
      HOST: 0.0.0.0
      INSERT_WORKERS: 3
      CORS_ORIGIN: "*"
      DB_POOL_MAX: 10
    ports:
      - "3000:3000"

volumes:
  pgdata:
